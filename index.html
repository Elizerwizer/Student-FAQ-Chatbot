<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIOU Student FAQ Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; }
  #chat { max-width: 520px; margin: 24px auto; background: #fff; border-radius: 12px;
          box-shadow: 0 2px 12px rgba(0,0,0,.12); display: flex; flex-direction: column; height: 80vh; }
  header { background: #0b6b3a; color: #fff; padding: 14px 16px; border-radius: 12px 12px 0 0; font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin: 8px 0; padding: 10px 12px; border-radius: 10px; max-width: 85%; line-height: 1.4;
         white-space: pre-wrap; word-wrap: break-word; }
  .user { background: #0b6b3a; color: #fff; margin-left: auto; }
  .bot { background: #eef1f4; color: #111; }
  .bot a { color: #0b6b3a; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e6e9; }
  input { flex: 1; padding: 10px; border: 1px solid #c9ced3; border-radius: 8px; font-size: 15px; }
  button { background: #0b6b3a; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="chat">
  <header>AIOU Student FAQ Assistant</header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Ask about admission, assignments, exams…" autocomplete="off" maxlength="1000">
    <button type="submit">Send</button>
  </form>
</div>

<script>
  // When embedding on another site, set this to your deployed API URL.
  const API_URL = location.origin.startsWith("http") ? "/chat" : "http://localhost:8000/chat";
  const log = document.getElementById("log");

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  // Minimal markdown: **bold** and [text](url)
  function render(s) {
    return escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function add(text, who) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.innerHTML = who === "bot" ? render(text) : escapeHtml(text);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  add("Hello! Ask me about AIOU admissions, assignments, exams, scholarships or plagiarism rules.", "bot");

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("input");
    const message = input.value.trim();
    if (!message) return;
    add(message, "user");
    input.value = "";
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      add(data.text, "bot");
    } catch (err) {
      add("Sorry, I could not reach the server. Please try again or email support@aiou.edu.pk.", "bot");
    }
  });
</script>
</body>
</html>
